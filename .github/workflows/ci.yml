
name: Portfolio CI/CD

# Trigger the workflow whenever code is pushed to main
on:
  push:
    branches:
      - main

  # Also allow manual execution from GitHub
  workflow_dispatch:

jobs:
  # Job 1: Build and check React application
  build:
    name: Build React Application
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Build React application
      - name: Build application
        run: npm run build

  # Job 2: Build Docker image
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    # Wait for Job 1 to succeed
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: my-portfolio:latest